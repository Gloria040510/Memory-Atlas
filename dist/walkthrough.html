<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="theme-color" content="#111215" />
    <title>导入演示 · 回声档案</title>
    <link rel="icon" href="atlas.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell demo-film">
      <a class="inline-link film-return" href="./">返回星图</a>
      <div class="film-heading">
        <h1 id="demo-title">从对话到星图</h1>
        <time datetime="PT42S">0:42</time>
      </div>
      <video
        controls
        playsinline
        preload="metadata"
        width="1280"
        height="720"
        poster="media/atlas-walkthrough.webp"
        aria-labelledby="demo-title"
        aria-describedby="demo-caption"
      >
        <source src="media/atlas-walkthrough.mp4" type="video/mp4" />
        <track
          kind="captions"
          src="media/atlas-walkthrough.zh.vtt"
          srclang="zh-CN"
          label="中文字幕"
        />
        <a href="media/atlas-walkthrough.mp4">打开导入演示视频</a>
      </video>
      <p id="demo-caption" class="film-caption">
        用示例对话演示导入、回看原文和添加复习卡。
      </p>
    </main>
  </body>
</html>
